[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ari-llm-platform"
version = "0.1.0"
description = "Local-first Adaptive Relational Intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "sqlite-vec",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]